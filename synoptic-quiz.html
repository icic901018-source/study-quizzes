const WEEKS=[...new Set(KO.map(q=>q.week))].sort((a,b)=>a-b);
const SECR={"3":"25, 271~273","4":"114, 267, 306","5":"150","6":"151~153, 155~156 (+154 1구절)","7":"159~161","8":"162~164","9":"165~168","10":"169~173, 219, 230","11":"174~175, 177, 179~182, 251","12":"194"};
const WN=w=>w==12?'퀴즈9 추가':w+'주차';
for(const w of WEEKS){const l=document.createElement('label');l.innerHTML=`<input type="checkbox" value="${w}"> ${WN(w)}${w==12?'(194)':''} (${KO.filter(q=>q.week==w).length})`;wkBox.appendChild(l)}
const wkCbs=()=>[...wkBox.querySelectorAll('input')];
const wk={onchange:null,get value(){const s=wkCbs().filter(c=>c.checked&&c.value!='all').map(c=>c.value);return s.length?s.join(','):'all'},
 set value(v){const s=String(v).split(',');wkCbs().forEach(c=>c.checked=c.value=='all'?v=='all':s.includes(c.value));if(!wkCbs().some(c=>c.checked))wkCbs()[0].checked=true}};
const wkSel=()=>wk.value=='all'?null:wk.value.split(',');
wkBox.addEventListener('change',e=>{const c=e.target;if(c.value=='all'){if(c.checked)wkCbs().forEach(x=>{if(x!=c)x.checked=false});else c.checked=true}
 else{wkCbs()[0].checked=!wkCbs().some(x=>x.value!='all'&&x.checked)}wk.onchange&&wk.onchange()});
function showWk(){wkWrap.style.display=lg.value=='ko'?'block':'none'}
{const I=document.getElementById('info');const nq={"ko": 153};
 let h='<b>기말고사 범위(교수님 공지)</b><br>1. 한글성경(개역개정): 퀴즈 1~9에 나온 기출 문제 전부<br>2. 헬라어: 마지막 강의안(269번 예루살렘 입성)에서만<br><br>';
 h+=`<b>한글</b>: 퀴즈 1~9의 한글 기출 ${nq.ko}문항 → 겹치는 구절을 합쳐 <b>${KO.length}구절</b>. 기출 문장이 두 절에 걸친 경우 두 절 모두 들어가 있고, 모든 문제는 <b>절 전체</b>를 보여 줘요. 답을 고르면 그 구절이 나온 기출(퀴즈 번호·문장)도 보여 줘요.<ul style="margin:4px 0">`;
 for(const w of WEEKS)h+=`<li>${WN(w)} (${SECR[w]}단락): ${KO.filter(q=>q.week==w).length}구절</li>`;
 h+=`</ul><b>헬라어</b>: 269번 강의안의 <b>${GR.length}구절</b> 전부 (마태 21:1-9 (${GR.filter(q=>q.ref[0]=='마').length}) · 마가 11:1-10 (${GR.filter(q=>q.ref[0]=='막').length}) · 누가 19:28-40 (${GR.filter(q=>q.ref[0]=='눅').length}) · 요한 12:12-19 (${GR.filter(q=>q.ref[0]=='요').length}), 요한은 답이 "없음"). 강의안 본문 그대로이고, 답을 고르면 강의안 직역과 개역개정을 함께 보여 줘요. 이전 주차 헬라어는 시험 범위가 아니라서 넣지 않았어요.<br><br>`;
 h+='<b>사용법</b><br>· 맨 위에서 한글/헬라어를 고르고, 한글은 주차를 여러 개 함께 고를 수 있어요(전체 포함).<br>· 문제는 무작위로 나오지만 진행 기록(맞힌 횟수·완료)은 그대로 저장돼요. 주차나 한글/헬라어를 바꿔도 기록은 지워지지 않아요.<br>· 학습중 10문항 중 하나가 나오고, 3번 연속 맞히면 완료로 이동하고 대기에서 새 문항이 들어와요. 틀리면 연속 기록이 0으로 돌아가요.<br>· 병행 구절은 비교할 수 있게 학습중에 함께 들어와요. 보기 순서는 항상 마태·마가·누가·없음이에요(키보드 1~4, Enter=다음).';
 I.innerHTML=h}
const pool=()=>BANK.filter(q=>q.lang==lg.value&&(q.lang=='grc'||!wkSel()||wkSel().includes(String(q.week))));
const rnd=a=>a[Math.random()*a.length|0];
const SEC={'154':'표적을 구함','194':'바리새인과 율법교사 책망','269':'예루살렘 입성','162':'엘리야에 관하여','163':'귀신 들린 아이','164':'두 번째 고난 예고','165':'성전세','166':'누가 큰가','167':'귀신을 내쫓는 사람','168':'넘어지게 하는 것','169':'잃은 양(마)','219':'잃은 양(눅)','170':'형제가 죄를 지으면(마)','230':'형제가 죄를 지으면(눅)','171':'두세 사람이 모이면','172':'용서에 관하여','173':'일만 달란트 비유','174':'예루살렘행 결심','251':'유대로 출발','175':'사마리아인의 거부','177':'칠십 인 파송','179':'보내진 자의 신분','180':'칠십 인의 귀환','181':'감사와 축복','182':'가장 큰 계명','25':'요한 성전 청결','271':'예루살렘 입성 후','272':'무화과나무','273':'성전 청결','114':'죄 지은 여인의 향유','267':'베다니 마리아의 향유','306':'베다니 향유','150':'전통 논쟁','151':'가나안 여인','152':'많은 병자를 고치심','153':'사천 명을 먹이심','155':'바리새인의 누룩','156':'벳새다 맹인','159':'첫 번째 고난 예고','160':'나를 따르려거든','161':'변화산'};
function fill(){const P=pool(),ids=new Set(P.map(q=>q.id));let A=AA[lg.value];
 A=A.filter(id=>ids.has(id)&&st(id)<3);
 let W=P.filter(q=>st(q.id)<3&&!A.includes(q.id));
 const multi=lg.value=='grc'||!wkSel()||wkSel().length>1;
 // 고르게 무작위: 한글 전체/여러 주차면 학습중에 가장 적게 들어간 주차, 한 주차면 단락, 헬라어면 복음서별로 고름
 const gk=q=>lg.value=='grc'?q.ref[0]:multi?q.week:q.section;
 while(A.length<MAX&&W.length){
  const cnt={};for(const id of A){const k=gk(byId(id));cnt[k]=(cnt[k]||0)+1}
  const ks=[...new Set(W.map(gk))],mn=Math.min(...ks.map(k=>cnt[k]||0)),kc=ks.filter(k=>(cnt[k]||0)==mn),kk=kc[Math.floor(Math.random()*kc.length)];
  const cl=[...new Set(W.filter(q=>gk(q)==kk).map(q=>q.cluster))];const pick=cl[Math.floor(Math.random()*cl.length)];
  const grp=W.filter(q=>q.cluster==pick);for(let i=grp.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[grp[i],grp[j]]=[grp[j],grp[i]]}
  for(const q of grp.slice(0,multi?2:3)){if(A.length>=MAX)break;A.push(q.id)}
  W=W.filter(q=>!A.includes(q.id));}
 AA[lg.value]=A;
 cW.textContent=W.length;cA.textContent=A.length;const m=P.filter(q=>st(q.id)>=3).length;cM.textContent=m;
 document.getElementById('fill').style.width=(P.length?100*m/P.length:0)+'%';save();}
function list(){act.innerHTML='<b>학습중 목록</b><br>'+AA[lg.value].map(id=>{const q=byId(id);return `<span class="${cur&&id==cur.id?'cur':''}">${dots(st(id))} <i>${q.section}</i> <span class="${q.lang}">${esc(q.full.slice(0,14))}…</span></span>`}).join('');}
function next(){fill();const A=AA[lg.value];if(!A.length){card.innerHTML='<h3>🎉 이 범위 전부 완료!</h3>';list();return}
 let c=A.filter(id=>!last.includes(id));if(!c.length)c=A;const id=rnd(c);cur=byId(id);
 last.push(id);while(last.length>Math.min(3,A.length-1))last.shift();
 const head=cur.lang=='grc'?'헬라어 · 269번 강의안':`${WN(cur.week)} · 개역개정 (기출)`;
 card.innerHTML=`<div class="meta">${head} · <span class="tag">${cur.section} ${SEC[cur.section]||''}</span></div><div id="streak">${dots(st(id))}</div><div class="frag ${cur.lang}">${esc(cur.full)}</div>`+OPTS.map(o=>`<button class="opt">${o}</button>`).join('');
 card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));list();}
function answer(b){const ok=b.textContent==cur.answer;card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent==cur.answer)x.classList.add('ok')});
 if(!ok)b.classList.add('bad');S[cur.id]=ok?st(cur.id)+1:0;const done=st(cur.id)>=3;
 document.getElementById('streak').textContent=dots(st(cur.id));
 let ex=`<p id="res">${ok?'✅ 정답':'❌ 오답'} — <b>${cur.answer}</b> (${cur.ref}${cur.answer=='없음'?', 요한복음':''})${done?' · 완료로 이동!':''}</p><p class="hint">💡 ${esc(cur.hint)}</p>`;
 ex+=cur.parallels?'<p class="meta">병행: '+cur.parallels+'</p>':'<p class="meta">병행 없음</p>';
 if(cur.lang=='ko')ex+='<div class="gich"><b>기출</b><br>'+cur.gichul.map(g=>`퀴즈 ${g.q}-${g.n}번: "${esc(g.t)}"${g.span.length>1?' <span class="meta">('+g.span.join(', ')+'에 걸침)</span>':''}`).join('<br>')+'</div>';
 else ex+=`<div class="gich"><b>강의안 직역</b><br>${cur.gloss.map(esc).join('<br>')}</div><p class="full">📖 개역개정 ${cur.ref}: ${esc(cur.ko)}</p>`;
 card.insertAdjacentHTML('beforeend',ex+'<button id="next">다음 ▶</button>');
 fill();list();document.getElementById('next').onclick=next;}
// 주차·언어를 바꾸면 학습중을 새 범위로 다시 채움(맞힌 횟수·완료 기록 S는 그대로)
wk.onchange=()=>{AA.ko=[];last=[];next()};
lgRadios().forEach(r=>r.onchange=()=>{last=[];showWk();next()});
reset.onclick=()=>{if(confirm('모든 기록(대기/학습중/완료)을 초기화할까요?')){for(const k in S)delete S[k];AA={ko:[],grc:[]};last=[];next()}};
document.onkeydown=e=>{if(e.target&&e.target.tagName=='TEXTAREA')return;const n=document.getElementById('next');if(n&&e.key=='Enter')return n.click();const k='1234'.indexOf(e.key);const bs=card.querySelectorAll('.opt');if(k>=0&&bs[k]&&!bs[k].disabled)bs[k].click()};
function exportCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(state()))))}
expBtn.onclick=()=>{const code=exportCode();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state())],{type:'application/json'}));a.download='공관복음_파이널_진행_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
 codeBox.value=code;codeWrap.style.display='block';codeBox.select();try{navigator.clipboard&&navigator.clipboard.writeText(code)}catch(e){}};
function importText(txt){txt=txt.trim();let D;try{D=JSON.parse(txt)}catch(e){try{D=JSON.parse(decodeURIComponent(escape(atob(txt))))}catch(e2){alert('불러오기 실패: 코드나 파일이 올바르지 않아요.');return}}
 if(!D||typeof D.s!='object'){alert('불러오기 실패: 진행 데이터가 아니에요.');return}apply(D);save();next();alert('진행을 불러왔어요!')}
impBtn.onclick=()=>{codeWrap.style.display='block';codeBox.value='';codeBox.placeholder='여기에 백업 코드를 붙여넣고 [코드 적용]을 누르거나, 아래에서 백업 파일을 고르세요.';codeBox.focus()};
applyBtn.onclick=()=>importText(codeBox.value);
impFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(f);impFile.value=''};
(async()=>{await Store.init();apply(await Store.load());
 if(Store.mode!='localStorage')warn(Store.mode=='none'?'⚠️ 이 화면(앱 미리보기 등)에서는 진행이 저장되지 않아요. Chrome·Safari 같은 브라우저로 열거나 [진행 내보내기]로 백업하세요.':'⚠️ 이 화면에서는 진행이 오래 보관되지 않을 수 있어요('+Store.mode+'). [진행 내보내기]로 백업해 두세요.');
 next();window.__ready=true;})();
</script></body></html>
