const WEEKS=[...new Set(BANK.map(q=>q.week))].sort((a,b)=>a-b);
for(const w of WEEKS){const l=document.createElement('label');l.style.marginRight='8px';l.innerHTML=`<input type="checkbox" value="${w}"> ${w}주차 (${BANK.filter(q=>q.week==w).length})`;wkBox.appendChild(l)}
const wkCbs=()=>[...wkBox.querySelectorAll('input')];
const wk={onchange:null,get value(){const s=wkCbs().filter(c=>c.checked&&c.value!='all').map(c=>c.value);return s.length?s.join(','):'all'},
 set value(v){const s=String(v).split(',');wkCbs().forEach(c=>c.checked=c.value=='all'?v=='all':s.includes(c.value));if(!wkCbs().some(c=>c.checked))wkCbs()[0].checked=true}};
const wkSel=()=>wk.value=='all'?null:wk.value.split(',');
wkBox.addEventListener('change',e=>{const c=e.target;if(c.value=='all'){if(c.checked)wkCbs().forEach(x=>{if(x!=c)x.checked=false});else c.checked=true}
 else{wkCbs()[0].checked=!wkCbs().some(x=>x.value!='all'&&x.checked)}wk.onchange&&wk.onchange()});
document.getElementById('info').textContent='이 퀴즈에는 '+WEEKS[0]+'주차~'+WEEKS[WEEKS.length-1]+'주차 강의안이 들어가 있습니다. 총 '+BANK.length+'문항이에요.';
const SECR={"3": "25, 271~273", "4": "114, 267, 306", "5": "150", "6": "151~153, 155~156", "7": "159~161", "8": "162~164", "9": "165~168", "10": "169~173, 219, 230", "11": "174~175, 177, 179~182, 251"};{const ul=document.createElement('ul');ul.id='wlist';ul.style.margin='6px 0 0';for(const w of WEEKS){const li=document.createElement('li');li.textContent=w+'주차('+(SECR[w]||'')+'단락): '+BANK.filter(q=>q.week==w).length+'문항 (한글 '+BANK.filter(q=>q.week==w&&q.lang=='ko').length+' · 헬라어 '+BANK.filter(q=>q.week==w&&q.lang=='grc').length+')';ul.appendChild(li)}const dv=document.createElement('div');dv.className='meta';dv.style.marginTop='6px';dv.textContent='주차별 수록 범위';document.getElementById('info').append(dv,ul)}
const pool=()=>BANK.filter(q=>(!wkSel()||wkSel().includes(String(q.week)))&&(lg.value=='all'||q.lang==lg.value));
const rnd=a=>a[Math.random()*a.length|0];
const SEC={'162':'엘리야에 관하여','163':'귀신 들린 아이','164':'두 번째 고난 예고','165':'성전세','166':'누가 큰가','167':'귀신을 내쫓는 사람','168':'넘어지게 하는 것','169':'잃은 양(마)','219':'잃은 양(눅)','170':'형제가 죄를 지으면(마)','230':'형제가 죄를 지으면(눅)','171':'두세 사람이 모이면','172':'용서에 관하여','173':'일만 달란트 비유','174':'예루살렘행 결심','251':'유대로 출발','175':'사마리아인의 거부','177':'칠십 인 파송','179':'보내진 자의 신분','180':'칠십 인의 귀환','181':'감사와 축복','182':'가장 큰 계명','25':'요한 성전 청결','271':'예루살렘 입성 후','272':'무화과나무','273':'성전 청결','114':'죄 지은 여인의 향유','267':'베다니 마리아의 향유','306':'베다니 향유','150':'전통 논쟁','151':'가나안 여인','152':'많은 병자를 고치심','153':'사천 명을 먹이심','155':'바리새인의 누룩','156':'벳새다 맹인','159':'첫 번째 고난 예고','160':'나를 따르려거든','161':'변화산'};
let anchor=null;
function fill(){const P=pool(),ids=new Set(P.map(q=>q.id));
 A=A.filter(id=>ids.has(id)&&st(id)<3);
 let W=P.filter(q=>st(q.id)<3&&!A.includes(q.id));
 while(A.length<MAX&&W.length){
  // 고르게 무작위: '전체'면 학습중에 가장 적게 들어간 주차, 한 주차면 가장 적게 들어간 단락에서 묶음을 Math.random으로 고름
  const gk=q=>(!wkSel()||wkSel().length>1)?q.week:q.section,cnt={};for(const id of A){const k=gk(byId(id));cnt[k]=(cnt[k]||0)+1}
  const ks=[...new Set(W.map(gk))],mn=Math.min(...ks.map(k=>cnt[k]||0)),kc=ks.filter(k=>(cnt[k]||0)==mn),kk=kc[Math.floor(Math.random()*kc.length)];
  const cl=[...new Set(W.filter(q=>gk(q)==kk).map(q=>q.cluster))];const best={cluster:cl[Math.floor(Math.random()*cl.length)]};
  const grp=W.filter(q=>q.cluster==best.cluster); for(let i=grp.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[grp[i],grp[j]]=[grp[j],grp[i]]}
  for(const q of grp.slice(0,(!wkSel()||wkSel().length>1)?2:3)){if(A.length>=MAX)break;A.push(q.id)}
  W=W.filter(q=>!A.includes(q.id));anchor=best.cluster;}
 anchor=null;
 cW.textContent=W.length;cA.textContent=A.length;const m=P.filter(q=>st(q.id)>=3).length;cM.textContent=m;
 document.getElementById('fill').style.width=(P.length?100*m/P.length:0)+'%';save();}
function list(){act.innerHTML='<b>학습중 목록</b><br>'+A.map(id=>{const q=byId(id);return `<span class="${cur&&id==cur.id?'cur':''}">${dots(st(id))} <i>${q.section}</i> ${q.fragment.slice(0,12)}…</span>`}).join('');}
function next(){fill();if(!A.length){card.innerHTML=pool().length?'<h3>🎉 이 범위 전부 완료!</h3>':'<h3>선택한 주차에는 이 언어(한글/헬라어) 문항이 없어요.</h3><p class="meta">헬라어 문항은 7~11주차에 있어요.</p>';list();return}
 let c=A.filter(id=>!last.includes(id));if(!c.length)c=A;const id=rnd(c);cur=byId(id);
 last.push(id);while(last.length>Math.min(3,A.length-1))last.shift();
 card.innerHTML=`<div class="meta">${cur.week}주차 · ${cur.lang=='grc'?'헬라어':'개역개정'} · <span class="tag">${cur.section} ${SEC[cur.section]||''}</span></div><div id="streak">${dots(st(id))}</div><div class="frag ${cur.lang}">${cur.full.startsWith(cur.fragment)?'':'… '}${cur.fragment}${cur.full.endsWith(cur.fragment)?'':' …'}</div>`+OPTS.map(o=>`<button class="opt">${o}</button>`).join('');
 card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));list();}
function answer(b){const ok=b.textContent==cur.answer;card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent==cur.answer)x.classList.add('ok')});
 if(!ok)b.classList.add('bad');S[cur.id]=ok?st(cur.id)+1:0;const done=st(cur.id)>=3;if(done)anchor=cur.cluster;
 document.getElementById('streak').textContent=dots(st(cur.id));
 card.insertAdjacentHTML('beforeend',`<p id="res">${ok?'✅ 정답':'❌ 오답'} — <b>${cur.answer}</b> (${cur.ref}${cur.answer=='없음'?', 요한복음':''})${done?' · 완료로 이동!':''}</p><p class="full ${cur.lang}">📖 ${cur.ref}: ${cur.full.replace(cur.fragment,'<mark>'+cur.fragment+'</mark>')}</p><p class="hint">💡 ${cur.hint}</p>${cur.parallels?'<p class="meta">병행: '+cur.parallels+'</p>':'<p class="meta">병행 없음</p>'}<button id="next">다음 ▶</button>`);
 fill();list();document.getElementById('next').onclick=next;}
// 주차 선택이 바뀌면 학습중을 새 범위에 맞게 다시 채움(맞힌 횟수·완료 기록 S는 그대로, 빠진 학습중은 대기로)
wk.onchange=()=>{A=[];last=[];next()};lg.onchange=()=>{last=[];next()};
reset.onclick=()=>{if(confirm('모든 기록(대기/학습중/완료)을 초기화할까요?')){for(const k in S)delete S[k];A=[];last=[];next()}};
document.onkeydown=e=>{const n=document.getElementById('next');if(n&&e.key=='Enter')return n.click();const k='1234'.indexOf(e.key);const bs=card.querySelectorAll('.opt');if(k>=0&&bs[k]&&!bs[k].disabled)bs[k].click()};

function exportCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(state()))))}
expBtn.onclick=()=>{const code=exportCode();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state())],{type:'application/json'}));a.download='공관복음_진행_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
 codeBox.value=code;codeWrap.style.display='block';codeBox.select();try{navigator.clipboard&&navigator.clipboard.writeText(code)}catch(e){}};
function importText(txt){txt=txt.trim();let D;try{D=JSON.parse(txt)}catch(e){try{D=JSON.parse(decodeURIComponent(escape(atob(txt))))}catch(e2){alert('불러오기 실패: 코드나 파일이 올바르지 않아요.');return}}
 if(!D||typeof D.s!='object'){alert('불러오기 실패: 진행 데이터가 아니에요.');return}apply(D);save();next();alert('진행을 불러왔어요!')}
impBtn.onclick=()=>{codeWrap.style.display='block';codeBox.value='';codeBox.placeholder='여기에 백업 코드를 붙여넣고 [코드 적용]을 누르거나, 아래에서 백업 파일을 고르세요.';codeBox.focus()};
applyBtn.onclick=()=>importText(codeBox.value);
impFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(f);impFile.value=''};
(async()=>{await Store.init();apply(await Store.load());
 if(Store.mode!='localStorage')warn(Store.mode=='none'?'⚠️ 이 화면(앱 미리보기 등)에서는 진행이 저장되지 않아요. Chrome·Safari 같은 브라우저로 열거나 [진행 내보내기]로 백업하세요.':'⚠️ 이 화면에서는 진행이 오래 보관되지 않을 수 있어요('+Store.mode+'). [진행 내보내기]로 백업해 두세요.');
 next();window.__ready=true;})();
</script></body></html>
